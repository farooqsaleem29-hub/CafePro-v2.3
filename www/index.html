<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CafePro</title>
<style>
:root{--b:#7a3e12;--bg:#faf6f1;--l:#e6dccf}*{box-sizing:border-box}
body{margin:0;font:14px Arial,sans-serif;background:var(--bg);color:#222;padding-top:env(safe-area-inset-top)}
header{background:var(--b);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}header input{font:inherit;padding:5px 8px;border-radius:5px;border:0}
nav{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--l)}
nav button{flex:none;border:0;background:0;padding:11px 13px;font:inherit;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{border-color:var(--b);color:var(--b);font-weight:700}
main{padding:12px}.w{overflow:auto;max-height:68vh;background:#fff;border:1px solid var(--l);border-radius:6px}
table{border-collapse:collapse;width:100%}th{position:sticky;top:0;background:#f0e6d8;font-size:12px;white-space:nowrap;padding:6px;z-index:1}
th,td{border:1px solid var(--l);padding:0}td.c,td.t{padding:6px;text-align:right;background:#fbf8f3;white-space:nowrap}
td input,td select{width:100%;min-width:90px;border:0;padding:6px;font:inherit;background:transparent}
.btn{background:var(--b);color:#fff;border:0;padding:8px 12px;border-radius:5px;margin:8px 6px 0 0;font:inherit;cursor:pointer}.btn.g{background:#888}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:#fff;border:1px solid var(--l);border-radius:8px;padding:12px}.card b{display:block;font-size:20px;margin-top:4px}
.neg{color:#b00020}.pos-x{}
.pos{display:grid;grid-template-columns:1fr 340px;gap:12px}@media(max-width:800px){.pos{grid-template-columns:1fr}}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;align-content:start}
.menu button{padding:14px 6px;border:1px solid var(--l);background:#fff;border-radius:8px;font:inherit;cursor:pointer}.menu button b{color:var(--b)}.menu .cat{padding:28px 6px;font-size:16px;font-weight:700}
.ln{display:flex;justify-content:space-between;gap:6px;padding:4px 0;align-items:center}.q{width:28px;height:28px;border:1px solid var(--l);background:#fff;border-radius:5px;cursor:pointer}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9}
.rc{background:#fff;padding:16px;width:320px;max-height:90vh;overflow:auto;border-radius:8px;font-size:13px}.rc .btn{margin-right:4px}
@page{margin:3mm}@media print{body>*:not(#ov){display:none!important}#ov{position:static!important;background:none!important;display:block!important}.rc{width:80mm!important;max-height:none!important;padding:0!important}.np{display:none}}.pos{color:#0a7a2f}h2{margin:4px 0 10px}.x{color:#b00020;cursor:pointer;padding:6px}.m{padding:8px;color:#777}

body{padding-bottom:72px}header{position:sticky;top:0;z-index:5}
nav{display:block;position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--l);border-bottom:0;padding-bottom:env(safe-area-inset-bottom)}
.gn{display:flex;overflow-x:auto}.gn button{flex:1;min-width:56px;border:0;background:0;padding:7px 2px;font:11px Arial,sans-serif;color:#666;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.gn button span{font-size:21px}.gn button.on{color:var(--b);font-weight:700;background:#f6ebdd}
.sub{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.sub button{border:1px solid var(--l);background:#fff;border-radius:20px;padding:8px 14px;font:inherit;cursor:pointer;white-space:nowrap}.sub button.on{background:var(--b);color:#fff;border-color:var(--b)}
@media(min-width:900px){body{padding:0 0 0 180px}nav{top:0;bottom:auto;width:180px;border-top:0;border-right:1px solid var(--l);padding-top:12px}.gn{flex-direction:column}.gn button{flex-direction:row;gap:10px;font-size:14px;padding:13px 16px;justify-content:flex-start}.pos .card{position:sticky;top:64px;align-self:start}}
.card{box-shadow:0 1px 3px #0001;border-radius:12px}.btn{padding:12px 16px;border-radius:10px;font-weight:700}
.menu{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.menu button{position:relative;min-height:76px;border-radius:12px;box-shadow:0 1px 2px #0001}.menu .cat{min-height:100px}
.bd{position:absolute;top:6px;right:6px;background:var(--b);color:#fff;border-radius:12px;padding:1px 8px;font-size:12px}
.c0{background:#fff1e0!important}.c1{background:#e8f3e8!important}.c2{background:#e6eefb!important}.c3{background:#fbe9ef!important}.c4{background:#f3ecfa!important}.c5{background:#fdf6d8!important}
.cbar{display:none;position:fixed;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));background:var(--b);color:#fff;padding:13px 14px;border-radius:12px;z-index:7;justify-content:space-between;cursor:pointer;box-shadow:0 2px 8px #0004}
@media(max-width:899px){.cbar.on{display:flex}}
.big{font-size:26px;font-weight:700}.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.pos2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}.cal .wd{text-align:center;font-size:11px;color:#777}
.cal .cd{background:#fff;border:1px solid var(--l);border-radius:8px;padding:4px;min-height:52px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:11px}
.cal .cd b{font-size:14px}.cal .cd.hi{background:#e8f6ea}.cal .cd.lo{background:#fde8e8}.cal .cd.sel{outline:2px solid var(--b)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;z-index:20;font-size:14px}
.fl{display:block;margin:8px 0 2px;font-size:12px;color:#555}.fl input,.fl select{display:block;width:100%;padding:10px;font-size:15px;margin-top:3px;border:1px solid var(--l);border-radius:8px;background:#fff}
.rc.fm{width:min(520px,94vw)}.rc.fm .btn{margin-top:12px}
.tbs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 10px}.tb{flex:none;width:58px;height:54px;border:1px solid var(--l);background:#fff;border-radius:10px;font:inherit;cursor:pointer}.tb.busy{background:#ffe3c2;border-color:#e09a3a}.tb.sel{outline:2px solid var(--b)}
.seg{display:flex;gap:6px;margin:6px 0}.seg button{flex:1;padding:9px;border:1px solid var(--l);background:#fff;border-radius:8px;font:inherit;cursor:pointer}.seg button.on{background:var(--b);color:#fff}
.nt{width:100%;padding:5px 8px;margin:0 0 6px;border:1px dashed var(--l);border-radius:6px;font-size:12px}.oos{opacity:.55}
.tree{display:none}.tree .th{font-size:11px;color:#999;text-transform:uppercase;padding:12px 16px 2px}
.tree button{display:block;width:100%;text-align:left;border:0;background:0;padding:9px 16px 9px 26px;font:14px Arial,sans-serif;cursor:pointer;color:#333}.tree button.on{background:#f6ebdd;color:var(--b);font-weight:700}
.mall .th{font-size:12px;color:#777;margin:12px 0 4px;font-weight:700}.mall .seg{flex-wrap:wrap}.mall .seg button{flex:none;min-width:30%}
@media(min-width:900px){nav{bottom:0;overflow-y:auto}.gn{display:none}.tree{display:block}}
body{font-family:Arial,'Segoe UI','Noto Sans Arabic','Noto Sans Devanagari','Noto Sans SC',Tahoma,sans-serif}[dir=rtl] td.c,[dir=rtl] td.t{text-align:left}
.lb{background:#fff3cd;color:#7a5b00;padding:6px;text-align:center;font-size:13px}.lb a{color:#7a3e12;font-weight:700;margin-left:8px}
</style></head><body>

 el.innerHTML=`<div class="rc"><b style="font-size:16px">✅ Din close ho gaya</b>${o.map(x=>`<hr><b>${x.d}</b><div class="ln"><span>Bills</span><span>${x.n}</span></div><div class="ln"><span>Net sales</span><span>PKR ${F(x.net)}</span></div><div class="ln"><span>Gross profit</span><span>PKR ${F(x.net-x.cost)}</span></div><div class="ln"><b>Daily profit</b><b>PKR ${F(dprofit(x.d).profit)}</b></div><div class="ln"><span>Expected cash</span><span>${x.exp==null?'—':'PKR '+F(x.exp)}</span></div>${x.open?`<div class="ln neg"><span>⚠ Payment baqi bills</span><span>${x.open}</span></div>`:''}`).join('')}<p class="m">Cash Closing tab mein asli ginti (Actual Cash) enter karen. Naya din shuru ho gaya hai.</p><div class="np"><button class="btn" onclick="tab='cash';render();document.getElementById('ov').remove()">Cash Closing kholen</button><button class="btn g" onclick="document.getElementById('ov').remove()">OK</button></div></div>`;document.body.appendChild(el)}

{const _al=window.alert.bind(window),_cf=window.confirm.bind(window);window.alert=m=>_al(trS(String(m)));window.confirm=m=>_cf(trS(String(m)))}


const LIC_ON=true,TRIAL_DAYS=14,PUBKEY='TL202yUpzF2KeoBzIUE-vGD_rmn6hqvKiVNIYMbkLg8';
let LS={t0:0,last:0,lic:'',id:''},RAWID='',LICREADY=!(window.cafe&&window.cafe.licGet);
const u8=s=>{s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
const b64u=u=>{let s='';u.forEach(c=>{s+=String.fromCharCode(c)});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const enc8=s=>new TextEncoder().encode(s);
function machineCode(raw){const h=nacl.hash(enc8('cafepro|'+raw));let x='';for(let i=0;i<6;i++)x+=h[i].toString(16).padStart(2,'0');x=x.toUpperCase();return x.slice(0,4)+'-'+x.slice(4,8)+'-'+x.slice(8,12)}
function licLoad(){try{return JSON.parse(localStorage.getItem('cafepro_lic')||'{}')}catch(e){return{}}}
function licSave(){try{localStorage.setItem('cafepro_lic',JSON.stringify(LS))}catch(e){}if(window.cafe&&window.cafe.licSet){try{window.cafe.licSet(JSON.stringify(LS))}catch(e){}}}
async function licInit(){
 if(!LIC_ON){LICREADY=true;render();return}
 let f={};const a=licLoad();
 if(window.cafe&&window.cafe.licGet){try{const g=await window.cafe.licGet();if(g)f=typeof g=='string'?JSON.parse(g):g}catch(e){}try{RAWID=(await window.cafe.machineId())||''}catch(e){}}
 const now=Date.now(),t0s=[a.t0,f.t0].filter(Boolean);
 LS={t0:t0s.length?Math.min(...t0s):now,last:Math.max(a.last||0,f.last||0),lic:a.lic||f.lic||'',id:a.id||f.id||''};
 if(!LS.id){try{LS.id=b64u(nacl.randomBytes(9))}catch(e){LS.id=Math.random().toString(36).slice(2,14)}}
 if(!RAWID)RAWID=LS.id;licSave();LICREADY=true;render()}
function licParse(k){try{const p=String(k).replace(/\s+/g,'').split('.');if(p.length!=3||p[0]!='CP1')return{ok:false,reason:'Invalid license key'};
 if(!nacl.sign.detached.verify(enc8(p[0]+'.'+p[1]),u8(p[2]),u8(PUBKEY)))return{ok:false,reason:'Invalid license key'};
 return{ok:true,pl:JSON.parse(new TextDecoder().decode(u8(p[1])))}}catch(e){return{ok:false,reason:'Invalid license key'}}}
function licValid(k){const r=licParse(k);if(!r.ok)return r;const pl=r.pl;
 if(pl.m&&pl.m!='*'&&pl.m!=machineCode(RAWID))return{ok:false,reason:'This key is for a different computer'};
 if(pl.e&&pl.e!='perpetual'&&pl.e<today())return{ok:false,reason:'This license has expired',pl};return{ok:true,pl}}
function licStatus(){if(!LIC_ON)return{s:'licensed',demo:1};const now=Date.now();let tamper=false;
 if(LS.last&&now<LS.last-864e5)tamper=true;else if(now-LS.last>6e4){LS.last=now;licSave()}
 if(LS.lic&&!tamper){const v=licValid(LS.lic);if(v.ok)return{s:'licensed',pl:v.pl,left:(v.pl.e&&v.pl.e!='perpetual')?Math.ceil((new Date(v.pl.e+'T23:59:59')-new Date())/864e5):null}}
 if(tamper)return{s:'expired',reason:'Clock problem detected. Please set the correct date and time, then enter your license key again.'};
 const left=TRIAL_DAYS-Math.floor((now-LS.t0)/864e5);if(left>0)return{s:'trial',left};
 return{s:'expired',reason:(LS.lic&&licValid(LS.lic).reason)||'Trial ended'}}
function activateKey(k){const key=String(k).replace(/\s+/g,''),v=licValid(key);if(!v.ok)return v;LS.lic=key;LS.last=Date.now();licSave();if(me){logA('License',(v.pl.c||'')+' '+(v.pl.e||''));save()}return{ok:true}}
function doActivate(){const k=($('#lk')||{}).value||'';if(!k.trim())return alert('Enter the license key');const r=activateKey(k);if(!r.ok)return alert(r.reason);toast('License activated ✔');render()}
function exportLocked(){const p=($('#lx-pin')||{}).value||'',o=D.users.find(u=>u.role=='owner'&&u.pin==hp(p));if(!o)return alert('Owner PIN is wrong');out('cafepro-backup-'+today()+'.json',JSON.stringify(D))}
const cpMid=()=>{const c=machineCode(RAWID);try{navigator.clipboard.writeText(c)}catch(e){}toast('Copied')};
function licKeyBox(){return`<div class="ln"><span>Machine ID</span><b style="font-size:16px">${machineCode(RAWID)}</b></div><button class="btn g" onclick="cpMid()">Copy</button><label class="fl">License key<textarea id="lk" rows="4" style="width:100%;padding:8px;border:1px solid var(--l);border-radius:8px"></textarea></label><button class="btn" onclick="doActivate()">Activate</button>`}
function licCardHtml(){const st=licStatus();let info;
 if(st.demo)info='<p class="m">Demo</p>';
 else if(st.s=='licensed')info=`<p style="margin:4px 0"><b>Licensed to ${esc(st.pl.c||'')}</b></p><div class="ln"><span>Plan</span><span>${esc(st.pl.p||'pro')}</span></div><div class="ln"><span>${st.pl.e&&st.pl.e!='perpetual'?'Valid until '+esc(st.pl.e):'Perpetual'}</span></div>`;
 else info=`<p style="margin:4px 0"><b>Not activated (trial)</b></p><div class="ln"><span>Trial: ${st.left||0} days left</span></div>`;
 return`<div class="card" style="margin-bottom:10px"><h3 style="margin-top:0">License</h3>${info}${st.demo?'':licKeyBox()}</div>`}
function showLicense(st){$('#nav').innerHTML='';$('#who').textContent='';$('#licbar').innerHTML='';
 $('#main').innerHTML=`<div class="card" style="max-width:520px;margin:30px auto"><h2>🔑 ${st.reason&&st.reason!='Trial ended'?'License':'Trial ended'}</h2><p class="m">${st.reason&&st.reason!='Trial ended'?esc(st.reason):'Trial ended. Enter a license key to continue.'}</p>${licKeyBox()}<hr><p class="m">Your data is safe. You can always export it with the owner PIN.</p>${D.users.length?`<label class="fl">Owner PIN<input id="lx-pin" type="password" inputmode="numeric"></label><button class="btn g" onclick="exportLocked()">Export my data</button>`:''}</div>`}
function licBar(){if(!LIC_ON||!LICREADY)return'';const st=licStatus(),own=me&&me.role=='owner',lnk=own?` <a href="#" onclick="tab='data';render();return false">Activate</a>`:'';
 if(st.s=='trial')return`<div class="lb"><span>⏳ Trial: ${st.left} days left</span>${lnk}</div>`;
 if(st.s=='licensed'&&st.left!==null&&st.left<=14)return`<div class="lb"><span>License expires in ${Math.max(0,st.left)} days</span></div>`;return''}
