CafePro v2.2 - how to build the Android APK (free, about 5 minutes)
1. Create a free account on github.com and make a new repository (for example: cafepro).
2. Upload ALL files of this folder to the repository: www, native, package.json, capacitor.config.json,
   .gitignore and the hidden ".github" folder (it must be uploaded too).
3. In the repository open "Actions" > "Build APK" > "Run workflow".
4. After 3-5 minutes open the finished run and download "CafePro-APK" from Artifacts. It contains app-debug.apk.
5. Copy the APK to the phone and install it (allow "Install unknown apps").
This is a NEW app (id com.zayn.cafepro): it installs next to the old Cafe Manager and keeps separate data.
To move data: old app > Settings > Export backup, then CafePro > Settings > Import backup.
If the build fails, send the error text from the failed step.

Trial and license (Android): 14-day free trial, then a license key is needed (Settings > License).
The Machine ID on Android is created when the app is first opened. If the app data is cleared or the app is
uninstalled, the Machine ID changes and a new key must be issued. Keep a backup of your data (Settings > Backup).
